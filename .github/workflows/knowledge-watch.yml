name: Knowledge evidence watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check approved links and collect evidence candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ENGINEERING_MODEL: ${{ vars.OPENAI_ENGINEERING_MODEL }}
        run: node scripts/knowledge-watch.js --out .verification-output/knowledge-watch/candidate-report.json
      - name: Upload unreviewed candidate report
        uses: actions/upload-artifact@v4
        with:
          name: schematicforge-knowledge-candidates
          path: .verification-output/knowledge-watch/candidate-report.json
          if-no-files-found: error
          retention-days: 30
